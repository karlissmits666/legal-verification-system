name: Continuity Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub continuity state
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository continuity
        shell: pwsh
        run: ./TOOLS/validate_project_continuity.ps1 -Mode GitHub -ExpectedCommit "${{ github.sha }}"

      - name: Validate Review 16 v7 implementation invariants
        shell: pwsh
        run: ./TOOLS/validate_review16_v7_implementation.ps1

      - name: Validate WS1 machine-readable contract layer
        shell: pwsh
        run: ./TOOLS/validate_ws1_contract_layer.ps1
